# Captain execs these commands without a shell; ci/test does any shell work.
test-suites:
  pr-tend:
    command: ci/test
    # Names repeat across files; a collision means ci/test's file= went missing.
    fail-on-duplicate-test-id: true
    results:
      path: test-results/report.xml
    output:
      reporters:
        rwx-v1-json: test-results/captain-results.json
